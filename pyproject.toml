[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# [test-system]
# requires = [ "pytest" ]  # PEP 508 specifications.
# test-backend = "pytest"

[project]
name = "weightedknn"
dynamic = ["version", "readme"]
dependencies = [
    'numpy>=1.22.4',
    'joblib',
    'scikit-learn>=1.2.2',
]
requires-python = ">=3.9"
authors = [
  {name = "Pawel Trajdos", email = "pawel.trajdos@pwr.edu.pl"},
]
maintainers = [
  {name = "Pawel Trajdos", email = "pawel.trajdos@pwr.edu.pl"}
]
description = "Weighted KNN Classifier"

license = "BSD-3-Clause"
license-files = ["LICEN[CS]E.*"]
keywords = ["KNN"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[tool.setuptools.dynamic]
version = {attr = "weightedknn.__version__"}  # any module attribute compatible with ast.literal_eval
readme = {file = ["README.md"]}

[project.urls]
Repository = "https://github.com/ptrajdos/WeightedKNNClassifier.git"


[project.optional-dependencies]
test = [
    'coverage>=7.8.0, <8.0.0',
    'unittest-parallel>=1.5.3, <2.0.0',
    'pandas>=2.0.0, <3.0.0',
    'pdoc3>=0.11.1, <0.12.0',
    'pytest>=8.3.5, <9.0.0',
    'pytest-cov>=6.1.1, <7.0.0',
    'pytest-profiling>=1.8.1, <2.0.0',
    'pytest-xdist>=3.6.1, <4.0.0',
    'snakeviz>=2.2.2, <3.0.0',
    'tox>=4.0.0, <5.0.0',
]
[tool.setuptools]
packages = { find = { include = ["weightedknn", "weightedknn.*"] } }