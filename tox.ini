[tox]
requires =
    tox>=4
# Only Python / scikit-learn combinations with published binary wheels.
env_list =
    py39-sklearn{122,13,14,15,16}
    py310-sklearn{122,13,14,15,16,17}
    py311-sklearn{122,13,14,15,16,17,18,19}
    py312-sklearn{13,14,15,16,17,18,19}
    py313-sklearn{15,16,17,18,19}
    py314-sklearn{17,18,19}
skip_missing_interpreters = true

[testenv]
description = run tests with {env_name}
package = wheel
wheel_build_env = .pkg
deps =
    pytest>=8.3.5, <9.0.0
    sklearn122: scikit-learn>=1.2.2, <1.3
    sklearn13: scikit-learn>=1.3, <1.4
    sklearn14: scikit-learn>=1.4, <1.5
    sklearn15: scikit-learn>=1.5, <1.6
    sklearn16: scikit-learn>=1.6, <1.7
    sklearn17: scikit-learn>=1.7, <1.8
    sklearn18: scikit-learn>=1.8, <1.9
    sklearn19: scikit-learn>=1.9, <1.10
    # scikit-learn < 1.4 is built against numpy 1.x
    sklearn{122,13}: numpy<2
    # scipy 1.15.x macOS wheels fail to load on recent macOS
    # (_spropack: '__DATA/__thread_bss' has a zero-fill section type)
    py310: scipy<1.15; sys_platform == "darwin"
commands =
    pytest {posargs:tests}
